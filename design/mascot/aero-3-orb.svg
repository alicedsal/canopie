    <radialGradient id="g-glow" cx="120" cy="188" r="80" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#B4FBFF" stop-opacity="0.95"/><stop offset="1" stop-color="#4FD0FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="g-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/></linearGradient>
    <linearGradient id="g-ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8DB9D8"/></linearGradient>
    <linearGradient id="g-white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CBEBFF"/></linearGradient>
    <linearGradient id="g-crust" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF2B8"/><stop offset="1" stop-color="#F7A531"/></linearGradient>
    <linearGradient id="g-leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCFF93"/><stop offset="1" stop-color="#34A62A"/></linearGradient>
